name: Build FreeFire Injector

on:
  workflow_dispatch:
  push:
    paths:
      - 'tweak/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Compile dylib (clang direto, sem Theos)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Mostra ambiente disponivel ────────────────────────────
      - name: Show environment
        run: |
          echo "=== Xcode version ==="
          xcode-select --print-path
          xcodebuild -version
          echo ""
          echo "=== iOS SDKs disponiveis ==="
          xcodebuild -showsdks | grep -i iphone
          echo ""
          echo "=== SDK path ==="
          xcrun --sdk iphoneos --show-sdk-path

      # ── Instala logos.pl do Theos (apenas o preprocessador) ──
      - name: Install Logos preprocessor
        run: |
          # Baixa apenas o logos.pl do repositorio do Theos
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/logos.pl -o /usr/local/bin/logos.pl
          chmod +x /usr/local/bin/logos.pl

          # Baixa as dependencias de runtime do Logos
          mkdir -p /tmp/logos_include
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/vendor/include/substrate.h \
               -o /tmp/logos_include/substrate.h 2>/dev/null || echo "substrate.h opcional"

          # Verifica se logos funciona
          echo "Logos OK:" && perl /usr/local/bin/logos.pl --help 2>&1 | head -3 || true

      # ── Compila a dylib com clang direto ─────────────────────
      - name: Compile dylib with clang
        working-directory: tweak
        run: |
          set -e

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"

          # Tenta processar com logos, se falhar usa ObjC puro
          if perl /usr/local/bin/logos.pl Tweak.x > Tweak_out.m 2>/dev/null; then
            echo "Logos processou Tweak.x com sucesso"
            SRC=Tweak_out.m
          else
            echo "Logos falhou, usando Tweak_simple.m"
            SRC=Tweak_simple.m
          fi

          echo "Compilando $SRC..."
          cat "$SRC" | head -20

          xcrun clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -I/tmp/logos_include \
            -o FreeFirInjector.dylib \
            "$SRC"

          echo ""
          echo "=== Build concluido! ==="
          ls -lh FreeFirInjector.dylib
          file FreeFirInjector.dylib
          otool -L FreeFirInjector.dylib

      # ── Upload ────────────────────────────────────────────────
      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFirInjector-dylib
          path: tweak/FreeFirInjector.dylib
          retention-days: 30
